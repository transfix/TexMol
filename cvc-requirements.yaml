# cvc-requirements.yaml — component set for TexMol.
#
# Usage:
#   cvcpkg install --from cvc-requirements.yaml --prefix ./deps
#
# TexMol needs a focused subset of libcvc-deps: Boost, CGAL,
# FFTW3, GSL, HDF5, Qt6 and GLEW for the GUI, OpenBLAS for LAPACK,
# and ImageMagick for texture I/O.  It does not use VTK, gRPC or the
# network stack.  On Windows also install pthreads4w; on Linux also
# libglvnd, glu, libx11, libsm and libice.  CI (.github/workflows/ci.yml)
# installs exactly this set per platform.

platform: auto
arch: auto
config: release
link: shared

components:
  - zlib
  - boost
  - cgal
  - fftw3
  - gsl
  - hdf5
  - tiff
  - imagemagick
  - qt6
  - glew
  - openblas
  - log4cplus

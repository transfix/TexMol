name: CI/CD

on:
  pull_request:
    branches: [ main, master, develop, modernization ]
  push:
    branches: [ main, master, modernization ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            build_type: Debug
            package_generator: DEB
          - os: ubuntu-latest
            build_type: Release
            package_generator: DEB
          # macOS
          - os: macos-latest
            build_type: Debug
            package_generator: DragNDrop
          - os: macos-latest
            build_type: Release
            package_generator: DragNDrop
          # Windows
          - os: windows-latest
            build_type: Debug
            package_generator: NSIS
          - os: windows-latest
            build_type: Release
            package_generator: NSIS

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Third-party dependencies via cvcpkg ──
      # cvcpkg resolves and installs prebuilt component bundles from
      # libcvc-deps.  When the catalog is available, this provides
      # Boost, Qt6, FFTW, GSL, HDF5, etc. in a single step.
      # On miss the action outputs path="" and we fall back to
      # system package managers below.
      - name: Install dependencies (cvcpkg)
        id: libcvc-deps
        uses: transfix/libcvc-deps/.github/actions/cvcpkg-install@v1.4.0
        with:
          requirements: cvc-requirements.yaml
          build_type: ${{ matrix.build_type }}
          link: shared

      # Export library paths so Qt host tools (uic, moc, rcc) can
      # find their shared libraries at build time.
      - name: Export runtime lib paths
        if: steps.libcvc-deps.outputs.path != ''
        shell: bash
        run: |
          deps='${{ steps.libcvc-deps.outputs.path }}'
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$deps/bin" >> "$GITHUB_PATH"
          else
            echo "LD_LIBRARY_PATH=$deps/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            echo "DYLD_LIBRARY_PATH=$deps/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$deps/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      # ── Prebuilt libcvc SDK ──
      # Downloaded from the libcvc GitHub release (no cvcpkg recipe
      # for libcvc itself yet).
      - name: Fetch prebuilt libcvc
        id: libcvc
        shell: bash
        run: |
          set -euo pipefail
          LIBCVC_TAG="v3.2.4"
          LIBCVC_PKG_VERSION="3.2.4"

          case "$RUNNER_OS" in
            Linux)   os=linux;   ext=tar.gz ;;
            macOS)   os=macos;   ext=zip ;;
            Windows) os=windows; ext=zip ;;
            *)       os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]'); ext=tar.gz ;;
          esac

          arch=$([[ "$os" == "windows" ]] && echo x86_64 || uname -m)
          btlc=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          stem="libcvc-${LIBCVC_PKG_VERSION}-${os}-${arch}-${btlc}"
          url="https://github.com/transfix/libcvc/releases/download/${LIBCVC_TAG}/${stem}.${ext}"

          prefix="$HOME/libcvc"
          [[ "$os" == "windows" ]] && prefix="D:/libcvc"
          mkdir -p "$prefix"

          tmp="$(mktemp -d)"
          echo "libcvc: downloading $url"
          if ! curl -fL -o "$tmp/${stem}.${ext}" "$url"; then
            echo "::warning::libcvc download failed — cmake configure will error"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$ext" in
            tar.gz) tar -xzf "$tmp/${stem}.${ext}" -C "$prefix" ;;
            zip)    unzip -q "$tmp/${stem}.${ext}" -d "$prefix" ;;
          esac

          root="$prefix"
          [[ -d "$prefix/$stem" ]] && root="$prefix/$stem"
          [[ ! -d "$root/lib" && ! -d "$root/include" ]] && \
            root="$(find "$prefix" -mindepth 1 -maxdepth 1 -type d | head -n1)"

          echo "libcvc: ready at $root"
          echo "path=$root" >> "$GITHUB_OUTPUT"

      # ── System fallback dependencies ──
      # Only installed when cvcpkg didn't provide the deps.

      - name: Install dependencies (Linux, system)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev libglew-dev \
            liblapack-dev libnsl-dev

      - name: Install dependencies (Linux, fallback)
        if: runner.os == 'Linux' && steps.libcvc-deps.outputs.path == ''
        run: |
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev libqt6opengl6-dev libqt6openglwidgets6 \
            qt6-base-private-dev \
            libboost-all-dev libcgal-dev libfftw3-dev libgsl-dev \
            liblog4cplus-dev libhdf5-dev libmagick++-dev

      - name: Install dependencies (macOS, system)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja glew qt@6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}" >> $GITHUB_ENV

      - name: Install dependencies (macOS, fallback)
        if: runner.os == 'macOS' && steps.libcvc-deps.outputs.path == ''
        run: |
          brew install boost fftw gsl log4cplus hdf5
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6);$(brew --prefix boost);$(brew --prefix log4cplus);$(brew --prefix fftw);$(brew --prefix gsl);$(brew --prefix hdf5)" >> $GITHUB_ENV

      - name: Install Qt (Windows, fallback)
        if: runner.os == 'Windows' && steps.libcvc-deps.outputs.path == ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          cache: true

      - name: Install dependencies (Windows, fallback)
        if: runner.os == 'Windows' && steps.libcvc-deps.outputs.path == ''
        run: |
          vcpkg install glew pthreads gsl --triplet x64-windows
        env:
          VCPKG_MAX_CONCURRENCY: 4

      # GLEW + pthreads always needed via vcpkg on Windows (not in
      # the libcvc-deps bundle).
      - name: Install GLEW + pthreads (Windows, cvcpkg hit)
        if: runner.os == 'Windows' && steps.libcvc-deps.outputs.path != ''
        run: vcpkg install glew pthreads --triplet x64-windows
        env:
          VCPKG_MAX_CONCURRENCY: 4

      # VTK may ship GL/ headers that conflict with the Windows SDK.
      - name: Remove conflicting GL headers (Windows)
        if: runner.os == 'Windows' && steps.libcvc-deps.outputs.path != ''
        shell: pwsh
        run: |
          $glDir = "${{ steps.libcvc-deps.outputs.path }}/include/GL"
          if (Test-Path $glDir) {
            Write-Host "Removing conflicting GL headers: $glDir"
            Remove-Item -Recurse -Force $glDir
          }

      # libcvc prebuilt bundles the Qt headers/cmake-configs it was built with
      # (6.8.x).  These conflict with the Qt 6.7 we install via aqtinstall, so
      # strip them from the prebuilt prefix — TexMol only needs cvc/*.h from it.
      - name: Remove bundled Qt from libcvc (Windows)
        if: runner.os == 'Windows' && steps.libcvc.outputs.path != ''
        shell: pwsh
        run: |
          $root = "${{ steps.libcvc.outputs.path }}"
          # Remove Qt headers
          Get-ChildItem -Path "$root/include" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'Qt*' } |
            ForEach-Object {
              Write-Host "Removing $($_.FullName)"
              Remove-Item -Recurse -Force $_.FullName
            }
          # Remove Qt cmake configs so find_package(Qt6) finds aqtinstall's Qt
          foreach ($d in @("$root/lib/cmake", "$root/cmake")) {
            if (Test-Path $d) {
              Get-ChildItem -Path $d -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like 'Qt*' } |
                ForEach-Object {
                  Write-Host "Removing $($_.FullName)"
                  Remove-Item -Recurse -Force $_.FullName
                }
            }
          }
          # Remove Qt DLLs/libs to avoid runtime conflicts
          foreach ($ext in @("Qt6*.dll", "Qt6*.lib")) {
            Get-ChildItem -Path "$root/lib" -Filter $ext -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "Removing $($_.FullName)"
                Remove-Item -Force $_.FullName
              }
            Get-ChildItem -Path "$root/bin" -Filter $ext -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "Removing $($_.FullName)"
                Remove-Item -Force $_.FullName
              }
          }

      # ── Configure ──
      # Assemble CMAKE_PREFIX_PATH from all available prefixes.
      - name: Configure
        shell: bash
        run: |
          prefixes=()
          [[ -n "${{ steps.libcvc.outputs.path }}" ]] && prefixes+=("${{ steps.libcvc.outputs.path }}")
          [[ -n "${{ steps.libcvc-deps.outputs.path }}" ]] && prefixes+=("${{ steps.libcvc-deps.outputs.path }}")
          [[ -n "${CMAKE_PREFIX_PATH:-}" ]] && prefixes+=("$CMAKE_PREFIX_PATH")
          # On Windows fallback, install-qt-action sets Qt6_DIR
          [[ -n "${Qt6_DIR:-}" ]] && prefixes+=("$Qt6_DIR")
          cmake_prefix=$(IFS=';'; echo "${prefixes[*]}")

          extra_args=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            extra_args+=("-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake")
          else
            extra_args+=("-G" "Ninja")
          fi

          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHAVE_PETSC=OFF \
            -DHAVE_NFFT=OFF \
            -DDISABLE_CGAL=ON \
            -DCMAKE_PREFIX_PATH="$cmake_prefix" \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/_install \
            "${extra_args[@]}"

      # ── Build ──
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ── Test ──
      - name: Configure tests
        if: matrix.build_type == 'Debug' && runner.os != 'Windows'
        shell: bash
        run: |
          prefixes=()
          [[ -n "${{ steps.libcvc.outputs.path }}" ]] && prefixes+=("${{ steps.libcvc.outputs.path }}")
          [[ -n "${{ steps.libcvc-deps.outputs.path }}" ]] && prefixes+=("${{ steps.libcvc-deps.outputs.path }}")
          [[ -n "${CMAKE_PREFIX_PATH:-}" ]] && prefixes+=("$CMAKE_PREFIX_PATH")
          cmake_prefix=$(IFS=';'; echo "${prefixes[*]}")
          cmake -B build-test \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTEXMOL_BUILD_TESTS=ON \
            -DHAVE_PETSC=OFF \
            -DHAVE_NFFT=OFF \
            -DDISABLE_CGAL=ON \
            -DCMAKE_PREFIX_PATH="$cmake_prefix"

      - name: Build tests
        if: matrix.build_type == 'Debug' && runner.os != 'Windows'
        run: cmake --build build-test --parallel

      - name: Run tests
        if: matrix.build_type == 'Debug' && runner.os != 'Windows'
        run: ctest --test-dir build-test --output-on-failure --parallel

      # ── Install ──
      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }}

      # ── Package ──
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        shell: pwsh
        run: |
          $nsisPath = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\NSIS' -ErrorAction SilentlyContinue).'(default)'
          if (-not $nsisPath) {
            $nsisPath = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\NSIS' -ErrorAction SilentlyContinue).'(default)'
          }
          if ($nsisPath) {
            $env:PATH = "$nsisPath;$env:PATH"
          }
          cpack -G NSIS -C ${{ matrix.build_type }}
          cpack -G ZIP -C ${{ matrix.build_type }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        working-directory: build
        run: cpack -G ${{ matrix.package_generator }} -C ${{ matrix.build_type }}

      # ── AppImage (Linux Release only) ──
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux' && matrix.build_type == 'Release'
        run: |
          set -e

          # Stage install tree into AppDir
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr

          # Copy desktop/icon to AppDir root (required by linuxdeploy)
          cp AppDir/usr/share/applications/texmol.desktop AppDir/
          cp AppDir/usr/share/icons/hicolor/256x256/apps/texmol.png AppDir/

          # Copy libcvc.so into AppDir for bundling
          libcvc_path="${{ steps.libcvc.outputs.path }}"
          if [ -n "$libcvc_path" ] && [ -d "$libcvc_path/lib" ]; then
            cp -a "$libcvc_path"/lib/libcvc.so* AppDir/usr/lib/ 2>/dev/null || true
          fi

          # Download linuxdeploy
          curl -L -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          # Build AppImage
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./linuxdeploy --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file AppDir/texmol.desktop \
            --icon-file AppDir/texmol.png

          # Rename to consistent scheme
          mv TexMol-*.AppImage "TexMol-${GITHUB_REF_NAME#v}-x86_64.AppImage" 2>/dev/null || \
            mv TexMol*.AppImage "TexMol-${{ matrix.build_type }}-x86_64.AppImage"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/*.deb
            build/*.dmg
            build/*.tar.gz
            build/*.exe
            build/*.zip
            *.AppImage
          retention-days: 30

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.build_type }}
          path: ${{ github.workspace }}/_install/
          retention-days: 14

  # ── Release ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*

      - name: Collect release assets
        run: |
          mkdir release-assets
          find artifacts -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.zip' -o -name '*.AppImage' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

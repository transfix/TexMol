name: CI/CD

on:
  pull_request:
    branches: [ main, master, develop, modernization ]
  push:
    branches: [ main, master, modernization ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-22.04
            build_type: Debug
            package_generator: DEB
          - os: ubuntu-22.04
            build_type: Release
            package_generator: DEB
          # macOS
          - os: macos-latest
            build_type: Debug
            package_generator: DragNDrop
          - os: macos-latest
            build_type: Release
            package_generator: DragNDrop
          # Windows. No Debug lane: the cvcpkg catalog has release-only Qt and
          # an MSVC Debug build cannot link release C++ libraries.
          - os: windows-latest
            build_type: Release
            package_generator: NSIS

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Third-party dependencies via cvcpkg ──
      # Every library and build tool comes from the cvcpkg catalog: no
      # apt/brew/vcpkg.  The catalog only has release builds of Qt and
      # friends, so Debug lanes build TexMol in Debug against release deps
      # (fine on Linux/macOS).  cvc-requirements.yaml lists the same set;
      # it can't scope pthreads4w to Windows, so the lists live here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cvcpkg
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install 'cvcpkg @ git+https://github.com/cy-pca/cvcpkg@master'

      - name: Install dependencies (cvcpkg)
        id: libcvc-deps
        shell: bash
        run: |
          set -euo pipefail
          components=(zlib boost cgal fftw3 gsl hdf5 tiff imagemagick qt6 glew openblas log4cplus)
          if [ "$RUNNER_OS" = "Windows" ]; then
            prefix="D:/libcvc-deps"
            # The runner's cmake: the catalog's cmake has no generator for
            # the image's Visual Studio.
            components+=(pthreads4w)
          else
            prefix="$HOME/libcvc-deps"
            components+=(cmake ninja)
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            # GL/GLU/X11 for QGLViewer and GLEW, from the catalog
            components+=(libglvnd glu libx11 libsm libice)
          fi
          cvcpkg install "${components[@]}" \
            --prefix "$prefix" --config release --link shared
          echo "path=$prefix" >> "$GITHUB_OUTPUT"

      # glew 2.2.0+cvc.2's exported targets name the builder's
      # /usr/lib/x86_64-linux-gnu/lib{GLU,SM,ICE}.so.  The prefix has all
      # three, so point the targets there until the glew recipe is fixed.
      - name: Point glew's targets at the prefix (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          f="${{ steps.libcvc-deps.outputs.path }}/lib/cmake/glew/glew-targets.cmake"
          sed -i -E 's#/usr/lib/x86_64-linux-gnu/lib(GLU|SM|ICE)\.so#${CMAKE_CURRENT_LIST_DIR}/../../../lib/lib\1.so#g' "$f"
          ! grep -n '/usr/lib' "$f"

      # Put the prefix's tools (cmake, ninja, cpack, qmake) on PATH and let
      # Qt's host tools (uic, moc, rcc) and the tests find its libraries.
      - name: Export runtime lib paths
        shell: bash
        run: |
          deps='${{ steps.libcvc-deps.outputs.path }}'
          echo "$deps/bin" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" != "Windows" ]; then
            echo "LD_LIBRARY_PATH=$deps/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            echo "DYLD_LIBRARY_PATH=$deps/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$deps/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      # ── libcvc ──
      # TexMol builds libcvc v3.2.4 from source with FetchContent (see
      # CMakeLists.txt) against the cvcpkg prefix.  The v3.2.4 GitHub release
      # bundles Ubuntu's own libhdf5_serial, which needs the system libcurl, and
      # the catalog's libcvc 3.2.4+cvc.N is newer source with a different API.

      # ── Configure ──
      # Assemble CMAKE_PREFIX_PATH from all available prefixes.
      - name: Configure
        shell: bash
        run: |
          cmake_prefix='${{ steps.libcvc-deps.outputs.path }}'

          extra_args=()
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            extra_args+=("-G" "Ninja")
          fi

          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHAVE_PETSC=OFF \
            -DHAVE_NFFT=OFF \
            -DDISABLE_CGAL=ON \
            -DCMAKE_PREFIX_PATH="$cmake_prefix" \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/_install \
            "${extra_args[@]}"

      # ── Build ──
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ── Test ──
      - name: Configure tests
        if: matrix.build_type == 'Debug' && runner.os != 'Windows'
        shell: bash
        run: |
          cmake_prefix='${{ steps.libcvc-deps.outputs.path }}'
          cmake -B build-test \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTEXMOL_BUILD_TESTS=ON \
            -DHAVE_PETSC=OFF \
            -DHAVE_NFFT=OFF \
            -DDISABLE_CGAL=ON \
            -DCMAKE_PREFIX_PATH="$cmake_prefix"

      - name: Build tests
        if: matrix.build_type == 'Debug' && runner.os != 'Windows'
        run: cmake --build build-test --parallel

      - name: Run tests
        if: matrix.build_type == 'Debug' && runner.os != 'Windows'
        run: ctest --test-dir build-test --output-on-failure --parallel

      # ── Install ──
      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }}

      # ── Package ──
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        shell: pwsh
        run: |
          $nsisPath = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\NSIS' -ErrorAction SilentlyContinue).'(default)'
          if (-not $nsisPath) {
            $nsisPath = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\NSIS' -ErrorAction SilentlyContinue).'(default)'
          }
          if ($nsisPath) {
            $env:PATH = "$nsisPath;$env:PATH"
          }
          cpack -G NSIS -C ${{ matrix.build_type }}
          cpack -G ZIP -C ${{ matrix.build_type }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        working-directory: build
        run: cpack -G ${{ matrix.package_generator }} -C ${{ matrix.build_type }}

      # ── AppImage (Linux Release only) ──
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux' && matrix.build_type == 'Release'
        run: |
          set -e

          # Stage install tree into AppDir
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr

          # Copy desktop/icon to AppDir root (required by linuxdeploy)
          cp AppDir/usr/share/applications/texmol.desktop AppDir/
          cp AppDir/usr/share/icons/hicolor/256x256/apps/texmol.png AppDir/

          # libcvc (built by FetchContent) is part of the install tree
          mkdir -p AppDir/usr/lib
          ls -la AppDir/usr/lib/ | grep -i cvc || echo "::warning::libcvc not in the install tree — AppImage may be incomplete"

          # Download linuxdeploy
          curl -fL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          # Build AppImage — libraries come from AppDir and the cvcpkg prefix
          deps='${{ steps.libcvc-deps.outputs.path }}'
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib:$deps/lib"
          export QMAKE="$deps/bin/qmake6"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

          ./linuxdeploy --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file AppDir/texmol.desktop \
            --icon-file AppDir/texmol.png

          # Rename to consistent scheme
          mv TexMol-*.AppImage "TexMol-${GITHUB_REF_NAME#v}-x86_64.AppImage" 2>/dev/null || \
            mv TexMol*.AppImage "TexMol-${{ matrix.build_type }}-x86_64.AppImage"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/*.deb
            build/*.dmg
            build/*.tar.gz
            build/*.exe
            build/*.zip
            *.AppImage
          retention-days: 30

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.build_type }}
          path: ${{ github.workspace }}/_install/
          retention-days: 14

  # ── Release ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*

      - name: Collect release assets
        run: |
          mkdir release-assets
          find artifacts -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.zip' -o -name '*.AppImage' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
